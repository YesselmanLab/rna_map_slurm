name: rna_map_slurm
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python version
  - python>=3.10

  # Core scientific packages
  - pandas>=1.5
  - numpy>=1.20
  - matplotlib>=3.5
  - pyyaml>=6.0
  - plotly

  # CLI and utilities
  - click>=8.0
  - tabulate>=0.9
  - colorlog

  # Bioinformatics tools (from bioconda)
  # NOTE: sabre not available for osx-arm64 via conda. On Apple Silicon use: brew install sabre
  - bowtie2
  - fastqc
  - cutadapt
  - trim-galore
  - seqkit
  # - sabre  # Install via: brew install sabre (macOS) or conda install -c bioconda sabre (Linux)

  # System utilities
  - unzip
  - curl
  - wget

  # Development tools
  - cython

  # Pip must be listed last before the pip section
  - pip
  - pip:
      # Install this package in editable mode
      - -e .

      # For plotly export
      - kaleido

      # Development dependencies
      - pytest>=7.0
      - pytest-cov>=4.0
      - pytest-mock>=3.10
      - ruff>=0.1.0
      - mypy>=1.0
      - pandas-stubs
      - types-PyYAML
      - types-tabulate

      # Lab-specific packages (install from GitHub or local)
      - git+https://github.com/jyesselm/rna_map.git
      - git+https://github.com/jyesselm/barcode_demultiplex.git
      - git+https://github.com/jyesselm/seq_tools.git
      - git+https://github.com/YesselmanLab/ylab_gdrive.git
