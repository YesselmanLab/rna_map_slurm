[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna_map_slurm"
version = "0.2.0"
description = "A tool for processing RNA-seq data on SLURM clusters"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Joe Yesselman", email = "jyesselm@unl.edu"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "numpy>=1.20",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "ruamel.yaml>=0.18",
    "submitit>=1.5",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Lab-specific and internal dependencies
full = [
    "rna_map",
    "barcode_demultiplex",
    "fastqsplitter",
    "seq_tools",
    "gsheets",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pandas-stubs",
    "types-PyYAML",
    "types-tabulate",
]

[project.scripts]
rna-map-slurm = "rna_map_slurm.cli.main:cli"
rna-map-slurm-runner = "rna_map_slurm.runner.main:cli"

[project.urls]
Homepage = "https://github.com/jyesselm/rna_map_slurm"
Repository = "https://github.com/jyesselm/rna_map_slurm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rna_map_slurm = ["resources/*.yml", "py.typed"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["rna_map_slurm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rna_map.*",
    "barcode_demultiplex.*",
    "fastqsplitter.*",
    "seq_tools.*",
    "gsheets.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=src/rna_map_slurm",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=10",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/rna_map_slurm"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
